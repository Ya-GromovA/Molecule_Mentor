# Оптимизировано для WSL с ограниченной памятью
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=384m -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Отключить параллелизм и daemon для экономии памяти
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=false

# AndroidX
android.useAndroidX=true
android.enableJetifier=true
